name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Unit tests (race)
      run: go test -race ./...

    - name: Integration tests (race)
      run: go test -race -tags=integration ./test/integration/...
