name: Deploy to abrah.ms

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build binaries
      run: |
        # Build protocol service with static linking
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o atchess-protocol ./cmd/protocol
        
        # Build web service with static linking
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o atchess-web ./cmd/web
        
        # Make binaries executable
        chmod +x atchess-protocol atchess-web
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
    
    # DRIFT GATE -- runs before anything on the server is touched, so a
    # refusal costs nothing. If the installed unit is not the unit in this
    # repository, then every test that reads deploy/systemd/ is describing a
    # file nobody runs, and the deploy is about to restart a service under
    # rules the suite never saw. Reads only; the deploy user cannot write
    # units by design. See deploy/scripts/check-unit-drift.sh.
    - name: Check systemd units match the repository
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'atchess-deploy' }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      run: |
        SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}" \
        SSH_OPTS="-i $HOME/.ssh/deploy_key -p ${DEPLOY_PORT} -o BatchMode=yes -o ConnectTimeout=10" \
        bash deploy/scripts/check-unit-drift.sh

    - name: Deploy to server
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'abrah.ms' }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'atchess-deploy' }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      run: |
        # Copy binaries
        scp -i ~/.ssh/deploy_key -P $DEPLOY_PORT \
          atchess-protocol atchess-web \
          $DEPLOY_USER@$DEPLOY_HOST:/tmp/
        
        # Skip wrapper script - not needed
        
        # Copy static files (without timestamps to avoid permission issues)
        tar czf static.tar.gz --mtime='@0' --owner=0 --group=0 -C web static
        scp -i ~/.ssh/deploy_key -P $DEPLOY_PORT \
          static.tar.gz \
          $DEPLOY_USER@$DEPLOY_HOST:/tmp/
        
        # Systemd service files are installed during initial setup only
        
        # Deploy and restart services
        ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
          set -e
          
          # Stop services before updating binaries (using sudo - allowed in sudoers)
          echo "Stopping services..."
          sudo systemctl stop atchess-protocol || true
          sudo systemctl stop atchess-web || true
          
          # Wait for services to fully stop
          sleep 2
          
          # Move binaries to a staging area with group permissions
          STAGING_DIR="/srv/atchess/staging"
          mkdir -p "$STAGING_DIR"
          
          # Copy new binaries to staging (we can write here)
          cp /tmp/atchess-protocol /tmp/atchess-web "$STAGING_DIR/"
          chmod +x "$STAGING_DIR"/atchess-*
          
          # Move binaries from staging to app bin directory
          # Since we're in the atchess group, we should be able to write if permissions are correct
          mkdir -p /srv/atchess/app/bin
          mv -f "$STAGING_DIR"/atchess-protocol /srv/atchess/app/bin/ || {
            echo "ERROR: Cannot write to /srv/atchess/app/bin/"
            echo "Directory permissions:"
            ls -ld /srv/atchess/app/ /srv/atchess/app/bin/
            echo "Current user groups:"
            id
            exit 1
          }
          mv -f "$STAGING_DIR"/atchess-web /srv/atchess/app/bin/
          chmod g+w /srv/atchess/app/bin/atchess-*

          # Clean up staging
          rmdir "$STAGING_DIR" 2>/dev/null || true
          
          # Extract static files
          cd /srv/atchess/app
          rm -rf web/static 2>/dev/null || true
          mkdir -p web

          # Extract directly to web directory
          cd web
          tar xzf /tmp/static.tar.gz
          chmod -R g+w static
          cd ..
          
          # Clean up temporary files
          rm -f /tmp/atchess-* /tmp/static.tar.gz 2>/dev/null || true
          
          # Restart services using sudo (allowed by sudoers)
          sudo systemctl daemon-reload
          sudo systemctl restart atchess-protocol
          sudo systemctl restart atchess-web
          
          # Check service status
          sleep 2
          sudo systemctl status atchess-protocol --no-pager || true
          sudo systemctl status atchess-web --no-pager || true
        ENDSSH
    
    - name: Verify deployment
      env:
        # THE SITE, NOT THE SSH HOST. These are different machines' worth of
        # different: DEPLOY_HOST is where the deploy ssh'es (abrah.ms), and
        # https://abrah.ms is a personal site that has never served ATChess.
        # Pointed there, the smoke test saw "/" answer 200 and then failed on
        # /client-metadata.json, so every deploy since the smoke test landed has
        # reported failure while the actual deployment was fine. A gate that
        # fails good work stops being believed, which is worse than not having
        # one -- so this is a bug in the gate and it is fixed here.
        ATCHESS_SITE: ${{ secrets.ATCHESS_SITE || 'https://atchess.abrah.ms' }}
      run: |
        # Wait for services to start
        echo "Waiting for services to start..."
        sleep 10
        
        # THE DEPLOYED SMOKE TEST IS THE GATE, and it exits non-zero.
        #
        # What was here before could not fail. It set HEALTH_OK=true if EITHER
        # the protocol health check OR the web service answered -- an OR where
        # it needed an AND -- so a healthy static page masked a completely dead
        # API. And even with HEALTH_OK=false it deliberately did not exit
        # non-zero ("Still don't exit with error to allow diagnostics to run").
        #
        # Measured 2026-08-30: a deploy crash-looped the protocol service on a
        # read-only filesystem, every /api/* path returned 502 for twenty
        # minutes, and this step reported the deploy successful. A gate that
        # cannot fail is not a gate; it is a green light wired to nothing.
        #
        # test/verify/deployed-smoke.sh probes every endpoint the UI calls with
        # the verb the UI uses, treats 5xx as down rather than as "answering",
        # and exercises handle resolution end to end. It is the same command a
        # human runs as `make verify`.
        echo "Running the deployed smoke test against $ATCHESS_SITE ..."
        bash test/verify/deployed-smoke.sh
        
        # Always check service status
        echo "Checking service status on server..."
        ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22} ${DEPLOY_USER:-atchess-deploy}@${DEPLOY_HOST:-abrah.ms} << 'ENDSSH'
          echo "=== Checking processes ==="
          ps aux | grep atchess | grep -v grep || true
          echo ""
          echo "=== Checking ports ==="
          netstat -tlnp 2>/dev/null | grep -E ':(8080|8081)' || ss -tlnp 2>/dev/null | grep -E ':(8080|8081)' || true
          echo ""
          echo "=== Checking binaries ==="
          ls -la /srv/atchess/app/bin/atchess-* || true
          echo ""
          echo "=== Checking systemd services (without sudo) ==="
          systemctl status atchess-protocol --no-pager 2>&1 || true
          echo ""
          systemctl status atchess-web --no-pager 2>&1 || true
        ENDSSH
        
        echo ""
        echo "🚀 Deployment complete!"
        echo "ATChess web interface is available at: https://$DEPLOY_HOST"
        echo ""
        echo "⚠️  IMPORTANT: The protocol service requires AT Protocol credentials!"
        echo "   Without valid Bluesky credentials in /etc/atchess/protocol.env,"
        echo "   the protocol service will not start."
        echo ""
        echo "To configure AT Protocol:"
        echo "1. SSH to the server"
        echo "2. Edit /etc/atchess/protocol.env" 
        echo "3. Add your Bluesky handle and app password"
        echo "4. Restart: sudo systemctl restart atchess-protocol"
    
    - name: Clean up SSH
      if: always()
      run: |
        rm -f ~/.ssh/deploy_key