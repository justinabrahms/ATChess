# Dual PDS setup for local E2E testing
# Two independent PDS instances, each hosting one test player.
# Uses HTTP (no SSL) for simplicity in local development.
#
# Usage: docker compose -f docker-compose.dual-pds.yml up -d
#        ./scripts/test-local.sh
#
# NETWORKING (see atchess-1c9.17 for the bug this fixes, and its bead notes
# for the empirical investigation behind this design):
#
# The official PDS image (@atproto/pds dist/config/config.js, envToCfg())
# derives its published serviceEndpoint *only* from PDS_HOSTNAME/PDS_PORT,
# and only supports two shapes -- there is no env var that sets an arbitrary
# publicUrl directly:
#   - PDS_HOSTNAME=localhost       -> serviceEndpoint = http://localhost:${PDS_PORT}
#   - PDS_HOSTNAME=<anything else> -> serviceEndpoint = https://<hostname>
#     (no port at all -- assumes a TLS-terminating reverse proxy on 443)
# For a local, plain-HTTP, two-PDS setup we are therefore locked into the
# first shape: the literal hostname "localhost" is unconditionally baked into
# each published serviceEndpoint, and the only thing that can differ between
# alice and bob is the port (PDS_PORT_ALICE=2583 vs PDS_PORT_BOB=2584).
#
# That literal "localhost" creates a genuine conflict between our two
# reachability requirements:
#   1. The host (where Go tests run) must be able to reach both endpoints.
#   2. Containers in the compose network (e.g. one PDS resolving and calling
#      the other's published serviceEndpoint, as real federation will do)
#      must ALSO be able to reach both endpoints, using that same literal
#      "http://localhost:<port>" string -- a client that only knows a DID
#      cannot rewrite the hostname it resolved.
# "localhost" cannot be redirected by ordinary compose-level DNS tricks:
# empirically (tested against this harness's actual container images),
# `extra_hosts: ["localhost:host-gateway"]` is silently ignored for the name
# "localhost" specifically (both glibc- and musl-based images special-case
# it independently of /etc/hosts content -- this is not the case for other,
# ordinary hostnames, which extra_hosts overrides normally). And
# `network_mode: host` -- which would make "localhost" mean the same
# real machine everywhere -- does not reliably proxy container ports back to
# the actual host in every Docker setup (confirmed here: with
# network_mode: host, `curl http://localhost:<port>` from the real host got
# "Connection refused", while the identical port published the ordinary way
# with `ports:` worked correctly), so it cannot be relied on to satisfy
# requirement 1.
#
# Resolution: pds-alice keeps ordinary bridge networking and publishes BOTH
# players' ports to the host (`ports:` maps 2583:2583 and 2584:2584) --
# this alone satisfies requirement 1 for both players, since Docker's own
# host<->container port forwarding is a real kernel/netns-level mechanism,
# not a DNS trick. pds-bob then joins pds-alice's network namespace via
# `network_mode: "service:pds-alice"` instead of getting its own. Inside that
# *shared* namespace, "localhost" genuinely is the same loopback for both
# processes (alice bound to :2583, bob bound to :2584), so
# `docker exec <either container> curl http://localhost:<either port>`
# reaches the right PDS regardless of which container you exec into --
# satisfying requirement 2 without touching the "localhost" special-case at
# all (no extra_hosts override needed; this is Docker's own namespace-sharing
# primitive, doing exactly what network_mode: host would do but scoped to
# just these two containers instead of the real host, so it works
# regardless of whether host networking is reliable in a given environment).
# pds-bob deliberately has no `ports:` of its own (invalid together with
# network_mode; alice's `ports:` already covers bob's port) and no separate
# `volumes`/`healthcheck` restriction -- those remain per-container as usual,
# only the network stack is shared.
#
# local-plc/local-plc-db do not need any of this: PDS_DID_PLC_URL and
# DATABASE_URL are plain outbound client config we set ourselves (not
# derived/locked by the PDS image's hostname branching above), so they use
# normal compose service-name DNS ("local-plc", "local-plc-db") exactly as
# before -- no "localhost" involved, no conflict.
#
# PLC directory mode (see ATCHESS_PLC_URL below and docs/local-pds-setup.md):
#   - LOCAL (default, `make test-federation-up`): PDS_DID_PLC_URL points at the
#     real, public https://plc.directory. Account creation publishes REAL,
#     PERMANENT DID documents to that third-party ledger -- it is append-only
#     and entries cannot be deleted. This is a consciously accepted limitation
#     for convenient ad-hoc local runs; do not loop `up`/`down -v` repeatedly.
#   - CI (`make test-federation-up-ci`): PDS_DID_PLC_URL is overridden to the
#     `local-plc` service below (profile "ci"), a hermetic did:plc server
#     backed by its own throwaway Postgres (also profile "ci"). Nothing is
#     published publicly and there is no dependency on a third party ATChess
#     does not operate. Both modes run the identical harness/account script --
#     only this URL differs.

services:
  # Throwaway Postgres for the local-plc service below. CI mode only (profile
  # "ci"); local mode never starts this container.
  #
  # NOTE: the did-method-plc server's built-in in-memory mock database
  # (selected by omitting DATABASE_URL) was tried first and rejected: its
  # Sequencer expects a real Database/kysely instance and throws
  # "Cannot read properties of undefined (reading 'selectFrom')" on startup,
  # so the mock path is not viable with the current upstream server build.
  # A real (but ephemeral, ci-only) Postgres is required instead.
  local-plc-db:
    image: postgres:16-alpine
    profiles: ["ci"]
    environment:
      - POSTGRES_USER=plc
      - POSTGRES_PASSWORD=plc
      - POSTGRES_DB=plc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: "no"
    container_name: atchess-local-plc-db

  # Local, hermetic did:plc server for CI mode only (profile "ci"). Built from
  # source (no maintained public image was found -- see task notes) from the
  # reference implementation that runs the real https://plc.directory.
  local-plc:
    build:
      context: https://github.com/did-method-plc/did-method-plc.git
      dockerfile: packages/server/Dockerfile
    profiles: ["ci"]
    depends_on:
      local-plc-db:
        condition: service_healthy
    environment:
      - PORT=2582
      - DATABASE_URL=postgres://plc:plc@local-plc-db:5432/plc
      - LOG_ENABLED=true
    # The image's default CMD (packages/server/service/index.js) is the
    # production/AWS entrypoint that requires DB_CREDS_JSON and dd-trace; we
    # want the plain dev entrypoint (packages/server/src/bin.ts, built to
    # dist/bin.js) which reads DATABASE_URL/PORT directly.
    command: ["node", "--enable-source-maps", "../dist/bin.js"]
    ports:
      - "${PLC_PORT:-2582}:2582"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2582/_health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"
    container_name: atchess-local-plc

  # Network-namespace owner for both PDSes -- see the NETWORKING comment
  # above. Publishes both alice's and bob's ports to the host.
  pds-alice:
    image: ghcr.io/bluesky-social/pds:latest
    ports:
      - "${PDS_PORT_ALICE:-2583}:${PDS_PORT_ALICE:-2583}"
      - "${PDS_PORT_BOB:-2584}:${PDS_PORT_BOB:-2584}"
    environment:
      - PDS_HOSTNAME=localhost
      - PDS_PORT=${PDS_PORT_ALICE:-2583}
      - PDS_JWT_SECRET=atchess-test-jwt-alice
      - PDS_ADMIN_PASSWORD=admin-alice
      - PDS_INVITE_REQUIRED=false
      - PDS_EMAIL_SMTP_URL=smtp://fake
      - PDS_EMAIL_FROM_ADDRESS=noreply@alice.localhost
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=${ATCHESS_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      - PDS_REPO_SIGNING_KEY_K256_PRIVATE_KEY_HEX=abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - PDS_SERVICE_DID=did:web:localhost%3A2583
      - PDS_DEV_MODE=true
    volumes:
      - pds-alice-data:/pds
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PDS_PORT_ALICE:-2583}/xrpc/_health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
    container_name: atchess-pds-alice

  # Shares pds-alice's network namespace instead of getting its own -- see
  # the NETWORKING comment above for why. No `ports:` here: that is invalid
  # together with `network_mode`, and pds-alice's `ports:` already publishes
  # bob's port too.
  pds-bob:
    image: ghcr.io/bluesky-social/pds:latest
    network_mode: "service:pds-alice"
    depends_on:
      pds-alice:
        condition: service_started
    environment:
      - PDS_HOSTNAME=localhost
      - PDS_PORT=${PDS_PORT_BOB:-2584}
      - PDS_JWT_SECRET=atchess-test-jwt-bob
      - PDS_ADMIN_PASSWORD=admin-bob
      - PDS_INVITE_REQUIRED=false
      - PDS_EMAIL_SMTP_URL=smtp://fake
      - PDS_EMAIL_FROM_ADDRESS=noreply@bob.localhost
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=${ATCHESS_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321
      - PDS_REPO_SIGNING_KEY_K256_PRIVATE_KEY_HEX=0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba
      - PDS_SERVICE_DID=did:web:localhost%3A2584
      - PDS_DEV_MODE=true
    volumes:
      - pds-bob-data:/pds
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PDS_PORT_BOB:-2584}/xrpc/_health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
    container_name: atchess-pds-bob

volumes:
  pds-alice-data:
    driver: local
  pds-bob-data:
    driver: local
