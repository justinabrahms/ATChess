# Dual PDS setup for local/CI E2E testing (atchess-1c9.24 topology).
# Two independent PDS instances, each hosting one test player, reachable at
# distinct hostnames (alice.pds.test / bob.pds.test) over HTTPS via a
# TLS-terminating Caddy reverse proxy on 443 -- the same production shape
# real Bluesky PDSes use (https, no port), and the shape that lets this
# harness catch bugs that a shared-loopback/same-hostname topology cannot.
#
# Usage: docker compose -f docker-compose.dual-pds.yml up -d
#        ./scripts/test-local.sh
#
# NETWORKING -- HISTORY AND WHY THIS CHANGED (atchess-1c9.24; supersedes the
# network_mode: "service:pds-alice" shared-namespace design from
# atchess-1c9.17, whose empirical findings below still stand and shaped this
# design):
#
# The official PDS image (@atproto/pds 0.5.27 dist/config/config.js,
# envToCfg()) derives its published serviceEndpoint *only* from
# PDS_HOSTNAME/PDS_PORT, and only supports two shapes -- there is no env var
# that sets an arbitrary publicUrl directly:
#   - PDS_HOSTNAME=localhost       -> serviceEndpoint = http://localhost:${PDS_PORT}
#   - PDS_HOSTNAME=<anything else> -> serviceEndpoint = https://<hostname>
#     (no port at all -- assumes a TLS-terminating reverse proxy on 443,
#     which is exactly what this file now provides)
# atchess-1c9.17 chose the "localhost" shape (both players differing only by
# port, alice publishing both ports and bob sharing her network namespace)
# because "localhost" cannot be redirected via ordinary compose-level DNS
# tricks -- empirically, `extra_hosts: ["localhost:host-gateway"]` is
# silently ignored for the literal name "localhost" (both glibc- and
# musl-based images special-case it, independent of /etc/hosts content).
# That topology worked, but atchess-1c9.24 (reviewer-found, during .17)
# recorded five things it could never catch: hostname-keyed (vs
# host+port-keyed) bugs invisible; peer-IP-keyed behaviour untestable (both
# players were one IP); bob had no compose DNS name; restarting alice
# destroyed bob's network stack (shared netns); and third-party containers
# on the compose network could not reach either endpoint at all (their own
# loopback != alice's).
#
# THIS DESIGN removes all five at once, using the SECOND shape above
# instead: pds-alice and pds-bob each get PDS_HOSTNAME set to a real,
# non-"localhost" hostname (alice.pds.test / bob.pds.test) -- unlike
# "localhost", `extra_hosts` DOES work for ordinary hostnames (reviewer-
# confirmed in atchess-1c9.24), so both containers and the host can be told
# where those names live without any special-casing. Each PDS gets its own,
# completely ordinary bridge network stack (no more network_mode sharing),
# its own compose DNS name, and is unaffected by the other being recreated.
# A Caddy reverse proxy (`proxy`, this project's production reverse proxy
# too -- see CLAUDE.md -- kept for consistency) terminates TLS on 443 for
# both hostnames and forwards to each PDS's plain-HTTP internal port
# (Docker's own service-name DNS resolves pds-alice/pds-bob for that hop;
# no extra_hosts needed there, only for the two custom hostnames below).
#
# THE TRAP THAT FORCED THE ORIGINAL "localhost" WORKAROUND, NOW HANDLED
# EXPLICITLY: @atproto/pds 0.5.27 branches on hostname in a SECOND place
# besides publicUrl -- serviceHandleDomains (dist/config/config.js, and
# dist/config/env.js's envList('PDS_SERVICE_HANDLE_DOMAINS'), confirmed by
# reading the running image, not just the docs):
#   hostname === 'localhost' ? ['.test'] : [`.${hostname}`]
# so switching PDS_HOSTNAME away from "localhost" would silently break the
# alice.test/bob.test handles unless PDS_SERVICE_HANDLE_DOMAINS is set
# explicitly. Both services below set it to ".test" so the handles this
# harness and its downstream consumers (test/harness/accounts.go,
# scripts/create-dual-pds-accounts.sh) already depend on keep working
# unchanged. PDS_SERVICE_HANDLE_DOMAINS is a comma-separated envList; each
# entry must start with "." (confirmed by reading env.js/config.js).
#
# CERTIFICATES: the proxy uses Caddy's `tls internal` directive (see
# docker/dual-pds/Caddyfile), which makes Caddy mint and self-manage its OWN
# local certificate authority instead of attempting public ACME issuance
# (which could never succeed for these non-public, non-resolvable test
# hostnames). scripts/extract-dual-pds-ca.sh pulls that CA's root
# certificate out of the `caddy-data` volume so everything that must trust
# alice.pds.test/bob.pds.test -- the Go test harness's spawned
# protocol-service subprocesses (test/harness/services.go sets
# SSL_CERT_FILE to a combined system+this-CA bundle), curl in
# scripts/create-dual-pds-accounts.sh (--cacert) -- can do REAL TLS
# verification against a real CA, deliberately NOT InsecureSkipVerify: this
# is one of the few places this harness can exercise TLS verification at
# all, so giving that up would be a real loss of coverage, not just a
# convenience.
#
# EXTRA_HOSTS AND THE PROXY'S STATIC IP: pds-alice and pds-bob need
# alice.pds.test/bob.pds.test to resolve to the proxy container (so that if
# either PDS process, or a script/tool, ever makes an outbound call to
# either published hostname, it reaches the proxy and not nowhere). Compose
# `extra_hosts` entries must be literal IPs (or the special `host-gateway`),
# not container/service names, so the `default` network below is pinned to
# a fixed subnet and the proxy is given a static address on it
# (172.28.90.10) purely so extra_hosts has something stable to point at.
# The SAME technique is used ad hoc (via `docker run --add-host=...`) to
# demonstrate that a throwaway THIRD-PARTY container on this network can now
# reach both endpoints by hostname -- see the runbook/PR notes for
# atchess-1c9.24 for that demonstration; nothing in this compose file
# depends on it.
#
# HOST RESOLUTION: the host machine (where `go test` and
# scripts/create-dual-pds-accounts.sh run) also needs
# alice.pds.test/bob.pds.test to resolve, to 127.0.0.1 (where the proxy
# publishes 443). `extra_hosts` is a per-container compose directive and has
# no effect on the host's own resolver, so this is handled by
# scripts/ensure-dual-pds-hosts.sh instead -- see that script for why it
# uses a docker-mounted /etc/hosts write rather than requiring an
# interactive `sudo` (not available non-interactively in every environment
# this harness runs in, including some CI/sandboxed agent environments).
#
# local-plc/local-plc-db do not need any of this: PDS_DID_PLC_URL and
# DATABASE_URL are plain outbound client config we set ourselves (not
# derived/locked by the PDS image's hostname branching above), so they use
# normal compose service-name DNS ("local-plc", "local-plc-db") exactly as
# before -- no extra_hosts, no hostname trickery.
#
# PLC directory mode (see ATCHESS_PLC_URL below and docs/local-pds-setup.md):
#   - LOCAL (default, `make test-federation-up`): PDS_DID_PLC_URL points at the
#     real, public https://plc.directory. Account creation publishes REAL,
#     PERMANENT DID documents to that third-party ledger -- it is append-only
#     and entries cannot be deleted. This is a consciously accepted limitation
#     for convenient ad-hoc local runs; do not loop `up`/`down -v` repeatedly.
#   - CI (`make test-federation-up-ci`): PDS_DID_PLC_URL is overridden to the
#     `local-plc` service below (profile "ci"), a hermetic did:plc server
#     backed by its own throwaway Postgres (also profile "ci"). Nothing is
#     published publicly and there is no dependency on a third party ATChess
#     does not operate. Both modes run the identical harness/account script --
#     only this URL differs.

networks:
  # Fixed subnet purely so the proxy container can be given a stable static
  # IP (see EXTRA_HOSTS comment above) for pds-alice/pds-bob's extra_hosts
  # entries to target. Every service below still resolves every other
  # service by its ordinary compose service name via Docker's embedded DNS,
  # exactly as on the un-pinned default network -- this only adds a fixed
  # address for the proxy on top of that.
  default:
    ipam:
      config:
        - subnet: 172.28.90.0/24

services:
  # Throwaway Postgres for the local-plc service below. CI mode only (profile
  # "ci"); local mode never starts this container.
  #
  # NOTE: the did-method-plc server's built-in in-memory mock database
  # (selected by omitting DATABASE_URL) was tried first and rejected: its
  # Sequencer expects a real Database/kysely instance and throws
  # "Cannot read properties of undefined (reading 'selectFrom')" on startup,
  # so the mock path is not viable with the current upstream server build.
  # A real (but ephemeral, ci-only) Postgres is required instead.
  local-plc-db:
    image: postgres:16-alpine
    profiles: ["ci"]
    environment:
      - POSTGRES_USER=plc
      - POSTGRES_PASSWORD=plc
      - POSTGRES_DB=plc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: "no"
    container_name: atchess-local-plc-db

  # Local, hermetic did:plc server for CI mode only (profile "ci"). Built from
  # source (no maintained public image was found -- see task notes) from the
  # reference implementation that runs the real https://plc.directory.
  local-plc:
    build:
      # Pinned to upstream refs/heads/main as of 2026-08-20 (upstream
      # publishes no tags, so a commit SHA is the only stable reference).
      # To update deliberately:
      #   git ls-remote https://github.com/did-method-plc/did-method-plc.git refs/heads/main
      # then replace the SHA below, re-run
      #   docker compose -f docker-compose.dual-pds.yml --profile ci build --no-cache local-plc
      # and re-run the federation suite (make test-federation-up-ci +
      # go test -tags=e2e ./test/e2e/... ./test/harness/...) before trusting
      # the bump. Also re-verify the `command:` below still points at a
      # valid dist/bin.js path for the new commit -- upstream layout is not
      # guaranteed stable across commits.
      context: https://github.com/did-method-plc/did-method-plc.git#2ed82a5ccf1b424aa5e2f6c5b461dc0ee133278b
      dockerfile: packages/server/Dockerfile
    profiles: ["ci"]
    depends_on:
      local-plc-db:
        condition: service_healthy
    environment:
      - PORT=2582
      - DATABASE_URL=postgres://plc:plc@local-plc-db:5432/plc
      - LOG_ENABLED=true
    # The image's default CMD (packages/server/service/index.js) is the
    # production/AWS entrypoint that requires DB_CREDS_JSON and dd-trace; we
    # want the plain dev entrypoint (packages/server/src/bin.ts, built to
    # dist/bin.js) which reads DATABASE_URL/PORT directly.
    command: ["node", "--enable-source-maps", "../dist/bin.js"]
    ports:
      - "${PLC_PORT:-2582}:2582"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2582/_health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"
    container_name: atchess-local-plc

  # TLS-terminating reverse proxy for both PDSes -- see the NETWORKING and
  # CERTIFICATES comments above. Publishes 443 to the host; internally
  # forwards alice.pds.test -> pds-alice and bob.pds.test -> pds-bob over
  # plain HTTP (Docker's own service-name DNS resolves those targets, no
  # extra_hosts needed for that hop). Not profile-restricted: both LOCAL and
  # CI modes need it.
  proxy:
    image: caddy:2.8-alpine
    networks:
      default:
        ipv4_address: 172.28.90.10
    ports:
      - "${PDS_PROXY_PORT:-443}:443"
    environment:
      # Caddyfile placeholder substitution (`{$VAR:default}`) so the proxy
      # keeps forwarding to the right internal port even if
      # PDS_PORT_ALICE/PDS_PORT_BOB are overridden.
      - PDS_PORT_ALICE=${PDS_PORT_ALICE:-2583}
      - PDS_PORT_BOB=${PDS_PORT_BOB:-2584}
    volumes:
      - ./docker/dual-pds/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      # Caddy's local admin API (plain HTTP, no TLS, enabled by default) --
      # deliberately NOT probing the HTTPS vhosts here, since that would
      # itself need CA trust/SNI plumbing this healthcheck doesn't need.
      # 127.0.0.1, not "localhost": this alpine image's wget resolves
      # "localhost" to ::1 first and the admin API's IPv6 loopback listener
      # refuses the connection (confirmed empirically), even though the
      # IPv4 listener answers fine.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"
    container_name: atchess-dual-pds-proxy

  pds-alice:
    image: ghcr.io/bluesky-social/pds:latest
    networks:
      - default
    # Own, ordinary network stack (no more network_mode sharing -- see
    # NETWORKING comment above). Port still published directly to the host
    # too, purely for scripts/test-local.sh and ad hoc debugging that talk
    # to a PDS's own port directly; the harness's real, hostname-shaped
    # traffic goes through `proxy` on 443 instead.
    ports:
      - "${PDS_PORT_ALICE:-2583}:${PDS_PORT_ALICE:-2583}"
    extra_hosts:
      - "alice.pds.test:172.28.90.10"
      - "bob.pds.test:172.28.90.10"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PDS_HOSTNAME=alice.pds.test
      - PDS_SERVICE_HANDLE_DOMAINS=.test
      - PDS_PORT=${PDS_PORT_ALICE:-2583}
      - PDS_JWT_SECRET=atchess-test-jwt-alice
      - PDS_ADMIN_PASSWORD=admin-alice
      - PDS_INVITE_REQUIRED=false
      - PDS_EMAIL_SMTP_URL=smtp://fake
      - PDS_EMAIL_FROM_ADDRESS=noreply@alice.localhost
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=${ATCHESS_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      - PDS_REPO_SIGNING_KEY_K256_PRIVATE_KEY_HEX=abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - PDS_DEV_MODE=true
      # Additive to Node's default trusted CA set (unlike Go's SSL_CERT_FILE,
      # NODE_EXTRA_CA_CERTS ADDS to, not replaces, the system store -- see
      # CERTIFICATES comment above), so PDS_CRAWLERS/PDS_DID_PLC_URL's real
      # public HTTPS targets keep working unchanged even with this set. Only
      # takes effect once scripts/extract-dual-pds-ca.sh has written this
      # file; harmless (Node just warns) if it doesn't exist yet.
      - NODE_EXTRA_CA_CERTS=/dual-pds-ca/ca.pem
    volumes:
      - pds-alice-data:/pds
      - ./certs/dual-pds:/dual-pds-ca:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PDS_PORT_ALICE:-2583}/xrpc/_health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
    container_name: atchess-pds-alice

  pds-bob:
    image: ghcr.io/bluesky-social/pds:latest
    networks:
      - default
    ports:
      - "${PDS_PORT_BOB:-2584}:${PDS_PORT_BOB:-2584}"
    extra_hosts:
      - "alice.pds.test:172.28.90.10"
      - "bob.pds.test:172.28.90.10"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PDS_HOSTNAME=bob.pds.test
      - PDS_SERVICE_HANDLE_DOMAINS=.test
      - PDS_PORT=${PDS_PORT_BOB:-2584}
      - PDS_JWT_SECRET=atchess-test-jwt-bob
      - PDS_ADMIN_PASSWORD=admin-bob
      - PDS_INVITE_REQUIRED=false
      - PDS_EMAIL_SMTP_URL=smtp://fake
      - PDS_EMAIL_FROM_ADDRESS=noreply@bob.localhost
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=${ATCHESS_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321
      - PDS_REPO_SIGNING_KEY_K256_PRIVATE_KEY_HEX=0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba
      - PDS_DEV_MODE=true
      - NODE_EXTRA_CA_CERTS=/dual-pds-ca/ca.pem
    volumes:
      - pds-bob-data:/pds
      - ./certs/dual-pds:/dual-pds-ca:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PDS_PORT_BOB:-2584}/xrpc/_health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"
    container_name: atchess-pds-bob

volumes:
  pds-alice-data:
    driver: local
  pds-bob-data:
    driver: local
  caddy-data:
    driver: local
